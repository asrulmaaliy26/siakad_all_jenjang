name: 🚀 Auto Deploy - admin-siakad.staialmannan.ac.id

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, libxml, openssl, pcre, phar, pdo, session, tokenizer, xmlwriter, fileinfo
          coverage: none

      - name: 📦 Install Composer Dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader --no-dev --no-interaction --prefer-dist"

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Assets (Vite)
        run: npm run build

      - name: 🗜️ Create Archive
        run: tar -czf ../release.tar.gz --exclude=.git --exclude=node_modules . && mv ../release.tar.gz .

      - name: 📤 Upload Archive ke VPS (Fast via Native SCP)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key release.tar.gz root@$HOST:/home/staialmannan/admin-siakad.staialmannan.ac.id/

      - name: ♻️ Extract & Setup di VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/staialmannan/admin-siakad.staialmannan.ac.id

            # Ekstrak file
            tar -xzf release.tar.gz
            rm release.tar.gz

            # Konfigurasi .env awal jika belum ada
            if [ ! -f .env ]; then
              if [ -f ".env.example" ]; then
                cp .env.example .env
              elif [ -f ".env copy" ]; then
                cp ".env copy" .env
              fi
              php artisan key:generate
            fi

            # Hapus file default Webuzo jika ada di public/
            rm -f public/default.html

            # Link storage jika belum ada
            php artisan storage:link || true

            # Jalankan migrasi database
            php artisan migrate --force

            # Bersihkan cache
            php artisan optimize:clear

            # Setup Ownership dan Permission Laravel di akhir agar file cache/log yang terbuat ber-owner benar
            chown -R staialmannan:staialmannan /home/staialmannan/admin-siakad.staialmannan.ac.id
            chmod -R 775 storage bootstrap/cache

            # Restart Apache dengan aman
            /usr/local/apps/apache2/bin/apachectl graceful
